services:
  watch-now:
    image: ${NOW_IMAGE:-ghcr.io/jermzone/watch-now:1.1.0}
    restart: unless-stopped
    ports:
      - "${NOW_HOST_BIND:-127.0.0.1}:${NOW_HOST_PORT:-9192}:8080"
    environment:
      DISPATCHARR_URL: ${DISPATCHARR_URL:?Set DISPATCHARR_URL to an address reachable from this container}
      NOW_DVR_MASTER_API_KEY: ${NOW_DVR_MASTER_API_KEY:-}
      NOW_PROGRAM_SEARCH_ENABLED: ${NOW_PROGRAM_SEARCH_ENABLED:-true}
      NOW_LISTEN_ADDRESS: ${NOW_LISTEN_ADDRESS:-:8080}
      NOW_COOKIE_SECURE: ${NOW_COOKIE_SECURE:-auto}
      NOW_TRUST_PROXY_HEADERS: ${NOW_TRUST_PROXY_HEADERS:-false}
      NOW_SESSION_IDLE_TIMEOUT: ${NOW_SESSION_IDLE_TIMEOUT:-30m}
      NOW_SESSION_ABSOLUTE_TIMEOUT: ${NOW_SESSION_ABSOLUTE_TIMEOUT:-12h}
      NOW_SESSION_LIMIT: ${NOW_SESSION_LIMIT:-512}
      NOW_UPSTREAM_TIMEOUT: ${NOW_UPSTREAM_TIMEOUT:-20s}
      NOW_UPSTREAM_MAX_MIB: ${NOW_UPSTREAM_MAX_MIB:-32}
      NOW_ARTWORK_MAX_MIB: ${NOW_ARTWORK_MAX_MIB:-2}
      NOW_CACHE_ENTRIES: ${NOW_CACHE_ENTRIES:-128}
      NOW_CACHE_MAX_MIB: ${NOW_CACHE_MAX_MIB:-32}
      NOW_CATEGORY_CACHE_TTL: ${NOW_CATEGORY_CACHE_TTL:-5m}
      NOW_CHANNEL_CACHE_TTL: ${NOW_CHANNEL_CACHE_TTL:-30s}
      NOW_EPG_CACHE_TTL: ${NOW_EPG_CACHE_TTL:-2m}
      NOW_ARTWORK_CACHE_TTL: ${NOW_ARTWORK_CACHE_TTL:-1h}
      NOW_CATALOG_CACHE_TTL: ${NOW_CATALOG_CACHE_TTL:-2m}
      NOW_DETAIL_CACHE_TTL: ${NOW_DETAIL_CACHE_TTL:-5m}
      NOW_VLC_SESSION_LIMIT: ${NOW_VLC_SESSION_LIMIT:-1024}
      NOW_LOGIN_RATE_LIMIT: ${NOW_LOGIN_RATE_LIMIT:-10}
      NOW_LOGIN_RATE_WINDOW: ${NOW_LOGIN_RATE_WINDOW:-5m}
      NOW_LOGIN_ACCOUNT_RATE_LIMIT: ${NOW_LOGIN_ACCOUNT_RATE_LIMIT:-30}
      NOW_LOGIN_RATE_PEERS: ${NOW_LOGIN_RATE_PEERS:-4096}
      NOW_DIAGNOSTIC_CACHE_TTL: ${NOW_DIAGNOSTIC_CACHE_TTL:-30s}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
