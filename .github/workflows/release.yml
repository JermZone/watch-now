name: Release container
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    # Leave this variable unset until the target repository is explicitly approved.
    if: ${{ vars.WATCH_NOW_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure public Docker Hub mirror
        # Preserve pinned Dockerfile digests; avoid shared-runner anonymous pull limits.
        run: |
          sudo python3 - <<'PYTHON'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          mirror = 'https://mirror.gcr.io'
          config['registry-mirrors'] = [mirror] + [url for url in config.get('registry-mirrors', []) if url != mirror]
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config) + '\n')
          PYTHON
          sudo systemctl restart docker
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Reject an existing release or versioned image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release-target.py "$RELEASE_TAG"
      - name: Verify release and test
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
          version=${RELEASE_TAG#v}
          test "$version" = "$(node -p "require('./frontend/package.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          go test ./...
          go vet ./...
          go test -race ./...
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          npm audit --prefix frontend --audit-level=high
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          python3 scripts/test-compose.py
          python3 scripts/test-latest-image.py
          python3 scripts/test-release-consistency.py
      - name: Prepare and check customer release assets before publication
        run: python3 scripts/prepare-release.py prepare "$VERSION" --notes-file "$RUNNER_TEMP/watch-now-release-notes.md"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: watch-now:candidate
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/JermZone/watch-now/tree/${{ github.ref_name }}
      - name: Verify persistent sharing storage
        run: python3 scripts/test-sharing-storage.py watch-now:candidate
      - name: Scan candidate before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: watch-now:candidate
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck immutable targets immediately before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release-target.py "$RELEASE_TAG"
      - name: Publish verified image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/jermzone/watch-now:${{ env.VERSION }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/JermZone/watch-now/tree/${{ github.ref_name }}
      - name: Finalize checked assets with the exact published digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: python3 scripts/prepare-release.py finalize "$VERSION" --digest "$IMAGE_DIGEST"
      - name: Scan the exact published image before release or latest promotion
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ghcr.io/jermzone/watch-now@${{ steps.publish.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$VERSION" == *-rc.* ]]; then
            prerelease=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" release/* \
            --verify-tag \
            --title "Watch Now $VERSION" \
            --notes-file "$RUNNER_TEMP/watch-now-release-notes.md" \
            "${prerelease[@]}"
      - name: Record safe recovery after partial image publication
        if: ${{ failure() && steps.publish.outputs.digest != '' }}
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "Version $VERSION was consumed by immutable image $IMAGE_DIGEST. Do not overwrite or rerun publication for this version. Correct the failure and prepare a new version; latest was not promoted by this failed release run." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: release-manifest
          path: release/
          if-no-files-found: ignore
