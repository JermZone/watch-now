name: Dependency action validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  release-actions-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate with release build action without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: watch-now:dependency-qa
      - name: Check loaded image and Buildx inspection
        run: |
          docker image inspect watch-now:dependency-qa
          docker buildx version
          docker buildx inspect --bootstrap
      - name: Prepare representative directory artifact
        run: |
          mkdir -p dependency-qa-artifact
          docker image inspect watch-now:dependency-qa --format '{{.Id}}' > dependency-qa-artifact/image-digest.txt
          cp LICENSE dependency-qa-artifact/
          cd dependency-qa-artifact
          sha256sum image-digest.txt LICENSE > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-action-smoke
          path: dependency-qa-artifact/
          if-no-files-found: error
          retention-days: 1
      - name: Scan candidate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: watch-now:dependency-qa
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
