name: Dependency action validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  release-actions-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate with release build action without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: watch-now:dependency-qa
      - name: Check loaded image and Buildx inspection
        run: |
          docker image inspect watch-now:dependency-qa
          docker buildx version
          docker buildx inspect --bootstrap
      - name: Prepare representative directory artifact
        run: |
          mkdir -p dependency-qa-artifact
          docker image inspect watch-now:dependency-qa --format '{{.Id}}' > dependency-qa-artifact/image-digest.txt
          cp LICENSE dependency-qa-artifact/
          cd dependency-qa-artifact
          sha256sum image-digest.txt LICENSE > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-action-smoke
          path: dependency-qa-artifact/
          if-no-files-found: error
          retention-days: 1
      - name: Scan candidate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: watch-now:dependency-qa
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
  synthetic-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: react
            ref: 1625bbfca502d2ff6c8427ed6ca4ca6a40c8522c
          - label: development
            ref: 5eeb9bde2f2172459fd4ca56fe5131fca34b0a81
          - label: mpegts
            ref: 729b85dfae34ef83200e8b88ec28017d5898ca06
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: qa-harness
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
          path: candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - name: Install synthetic media fixture generator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build exact candidate and install browser driver
        run: |
          npm ci --prefix candidate/frontend
          npm run build --prefix candidate/frontend
          npm install --prefix "${RUNNER_TEMP}/browser-qa" --no-save playwright@1.55.1
      - name: Test synthetic video and viewer flows on desktop and phone layouts
        env:
          QA_MEDIA: '1'
          QA_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          export QA_CHROME=$(command -v google-chrome)
          export NODE_PATH="${RUNNER_TEMP}/browser-qa/node_modules"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 20 -c:v libx264 -preset ultrafast -profile:v baseline -pix_fmt yuv420p -g 25 -c:a aac -b:a 96k -f mpegts qa-harness/scripts/sample.ts
          node qa-harness/scripts/dependency-browser-qa.cjs "$PWD/candidate" "$QA_LABEL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-${{ matrix.label }}
          path: qa-harness/scripts/*.png
          retention-days: 1
