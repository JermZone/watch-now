name: Promote published release to latest
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to promote (newest stable version only)
        required: true
        default: v1.3.0
permissions:
  contents: read
concurrency:
  group: promote-latest
  cancel-in-progress: false
jobs:
  promote:
    if: ${{ vars.WATCH_NOW_RELEASE_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify published release and checksummed digest
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: python3 scripts/resolve-latest-image.py "$RELEASE_TAG"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote exact image and verify latest digest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          EXPECTED_DIGEST: ${{ steps.release.outputs.digest }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          version_image="ghcr.io/jermzone/watch-now:${RELEASE_TAG#v}"
          version_digest=$(docker buildx imagetools inspect "$version_image" --format '{{json .Manifest}}' | jq -r '.digest')
          test "$version_digest" = "$EXPECTED_DIGEST"
          docker buildx imagetools create --prefer-index=false --tag ghcr.io/jermzone/watch-now:latest "$IMAGE"
          latest_digest=$(docker buildx imagetools inspect ghcr.io/jermzone/watch-now:latest --format '{{json .Manifest}}' | jq -r '.digest')
          test "$latest_digest" = "$EXPECTED_DIGEST"
          echo "latest now points to $RELEASE_TAG ($EXPECTED_DIGEST)" >> "$GITHUB_STEP_SUMMARY"
