# Include in nginx's http {} context. Replace hostname and certificate paths.
# These logs deliberately omit URI/query data (including VLC bearer tokens).
log_format now_safe '$remote_addr $request_method $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=now_login:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=now_connections:10m;

server {
    listen 80;
    server_name now.example.com;
    return 301 https://now.example.com$request_uri;
    access_log /var/log/nginx/now-access.log now_safe;
    error_log /var/log/nginx/now-error.log crit;
}

server {
    listen 443 ssl;
    server_name now.example.com;
    ssl_certificate /etc/letsencrypt/live/now.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/now.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/now-access.log now_safe;
    error_log /var/log/nginx/now-error.log crit;
    client_max_body_size 32k;
    limit_conn now_connections 20;
    limit_conn_status 429;

    location = /api/auth/login {
        limit_req zone=now_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9192;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:9192;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
