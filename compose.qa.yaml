# Isolated viewer QA stack. Populate .env privately on the deployment host.
services:
  watch-now:
    image: ${NOW_QA_IMAGE:?Set NOW_QA_IMAGE to the exact QA image tag}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${NOW_QA_HOST_BIND:-127.0.0.1}:${NOW_QA_HOST_PORT:-19195}:8080"
    environment:
      DISPATCHARR_URL: ${DISPATCHARR_URL:?Set the Dispatcharr HTTP address}
      NOW_PROGRAM_SEARCH_ENABLED: "true"
      NOW_DVR_MASTER_API_KEY_FILE: /run/secrets/watch_now_dvr_master_key
      NOW_SHARE_KEY_DIR: /var/lib/watch-now
      NOW_COOKIE_SECURE: ${NOW_COOKIE_SECURE:-auto}
      NOW_TRUST_PROXY_HEADERS: "false"
    secrets:
      - watch_now_dvr_master_key
    volumes:
      - watch_now_share_data:/var/lib/watch-now
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
secrets:
  watch_now_dvr_master_key:
    file: ./secrets/dvr-master-api-key.txt
volumes:
  watch_now_share_data:
